################################################################################
## VARIABLES / SETTINGS
################################################################################

[Variables]
; This allows auto camera rotation when strafe left or right, so can fully
; steer using only the left analog stick while this is active. Best to turn
; off if prefer to play in first-person view.
CamSteer = Yes
; This can enable 'LookAuto' mouse mode which uses left click instead of
; right-click when holding still so can move camera without turning character.
; Convenient and gives a more console-game feel, but can sometimes cause weird
; mouse issues temporarily as swap back and forth, particularly with UI windows
; open. Options are to only use it after sitting, any time holding still, or
; not use it (need to hold L2 to manually switch to LookOnly mouse mode).
AutoLookMode = Stationary
; Enables L2 + DPad left/right to activate Windows Magnifier shortcut keys
WinMag = No
; Enabled L2 + FPad 4-dir menu as alternate method for using abilities
QuickCastType = ${CopyIconsEnabled ? 2 : 0}
QuickCastMenu = ${QuickCastType > 1 ? QuickCast16 : QuickCast4}
; Allows alternate button mappings using ButtonSwap (Modern or EQOA)
ButtonMap = Modern
; Makes Cancel (circle) button close out MiniInventory if it is open
CancelCloseMiniInv = No
ReadyToCloseMiniInv = ${CancelCloseMiniInv ? ${MiniInvShown ? Yes}}
; Changes how ability menu looks/works
AbilMenuType = ${CopyIconsEnabled ? 0 : 2}
AbilMenuOverlapGame = ${CopyOverlappedIcons ? Yes : No}
AbilMenuTypeLabel = ${AbilMenuType[0:Basic, 1:EQOA, 2:Highlight]}
AbilMenuHoriz = ${AbilMenuType != 2 ? ${AbilWinType = 2 ? ${AbilMenuOverlapGame ? Yes : No} : No} : No}
AbilMenuStyle = ${AbilMenuType[0:${AbilMenuHoriz ? Bar : List}, 1:${AbilMenuHoriz ? Bar : Slots}, Highlight}
AbilMenuVert = ${AbilMenuStyle[Slots:Yes, List:Yes, No]}
AbilMenuScale = ${AbilMenuOverlapGame ? ${AbilWinScale} : ${ResScale * 1.5}}
AbilMenuTitleHeight = ${AbilMenuStyle = Slots ? ${AbilMenuScale * 20} : 0}
AbilBarsXPos = ${AbilMenuOverlapGame ? ${AbilL} ${AbilMenuVert ? +${AbilMenuScale * ${AbilW}}} : 99%}
AbilBarsYPos = ${AbilMenuOverlapGame ? ${AbilT} - ${AbilMenuTitleHeight} : 8%}
AbilityHUD = ${AbilMenuStyle = Highlight ? AbilityHighlight : "AbilityBars, AbilityBarMask"}
AbilityMenu = ${AbilMenuStyle = Highlight ? AbilityHighlight : AbilityBars}
MemSlotMenu = ${BookLayout = Skills ? MemSkillSlots : MemAbilitySlots}
; Contents of Highlight-style Ability Menu
AbilHighlightAuraCount = 0
AbilHighlightHasHotbars = Yes
; Contents of multi-bar Ability Menu
AbilShowTitle = ${AbilMenuType = 1 ? Yes : No}
AbilShowAltLabel = Yes
AbilBarOn1 = Yes
AbilBarTitle1 = Primary
AbilBarDefault1 = ${AbilMenuType = 1 ? Recall : Match}
AbilBarAutoAdvance1 = No
AbilBarOn2 = Yes
AbilBarTitle2 = Secondary
AbilBarDefault2 = ${AbilMenuType = 1 ? Recall : Match}
AbilBarAutoAdvance2 = No
AbilBarOn3 = Yes
AbilBarTitle3 = Hotbar
AbilBarDefault3 = ${AbilMenuType = 1 ? Recall : Match}
AbilBarAutoAdvance3 = No
AbilBarOn4 = No
AbilBarTitle4 = Rotation Example
AbilBarDefault4 = ${AbilMenuType = 1 ? Recall : Match}
AbilBarAutoAdvance4 = Yes
AbilBarOn5 = No
AbilBarTitle5 = Extra
AbilBarDefault5 = ${AbilMenuType = 1 ? Recall : Match}
AbilBarAutoAdvance5 = No
AbilBarCount = ${AbilBarOn1 + ${AbilBarOn2 + ${AbilBarOn3 + ${AbilBarOn4 + ${AbilBarOn5}}}}}
AbilBarEditNum = 1
; Allow editing some overlay menus at runtime with these
; (may want to disable if tend to hold button without thinking during combat!)
AllowEditMacros = Enabled
AllowEditQuickCast = Enabled
AllowEditMenus = Disabled
; [L2]+Select/Start shortcut assignments
HoldStartKeybind = Do nothing
TapL2StartKeybind = Inventory
HoldL2StartKeybind = Bags
TapSelectKeybind = MiniInventory
HoldSelectKeybind = MiniInventory + Bags
TapL2SelectKeybind = Screenshot
HoldL2SelectKeybind = ToggleUI
VarToAssign = TapL2StartKeybind
; Used by Quick Loot feature to know which slot to jump cursor to next
NextLootSlotNum = 1


