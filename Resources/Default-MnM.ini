ParentProfile = MnM_Base

; Remove below line to stop automatic replacement by newer versions of the app
AutoGeneratedVersion = 0

################################################################################
## BASIC CONTROLS
##
## This control scheme is designed to emulate that used by the PS2 MMO "EQOA".
##
## Additional actions not included in EQOA like jump, sit, and mouse-dependent
## tasks like inventory management needed to be added by things like holding a
## button briefly vs tapping it doing different things, or button combinations
## (usually with L2, such as L2+D-Pad to use mouse wheel for camera zoom or
## scrolling chat window text). Some buttons also have different actions for
## different contextual "modes" - cursor, menu, macros, book, or action mode.
##
## The face button assignments were swapped around from EQOA's layout to be
## more like modern games (i.e. Circle instead of Triangle for "cancel"), but
## an option is included to swap these back via Main Menu->Overlay->Settings.
##
## Basic Controls:
##
## Left Analog Stick - Move character
## Right Analog Stick - Move mouse (cursor or camera)
## D-Pad - Navigate menus / jump mouse cursor, [L2] Mouse wheel / camera zoom
##         (Hold) Edit macro in Macros menu
##
## Circle - [Tap] Esc/Cancel/Back, [Hold] Sit
## Square - Toggle Auto-attack
## Triangle - Use Ability / Switch to Action Mode
##            [Hold] Jump to first ability, [D-Pad] Jump 5 ability slots
## X - Confirm menu selections / Left-click / Switch to Cursor Mode
##     [L1] Shift-click, [R1] Ctrl-click, [L1+R1] Alt-click
##
## L1 - Target self/pet/group members (see TARGET GROUP section for details)
## R1 - Target NPCs, [L2] Target PCs
## L2 - [Tap] Switch to Macros Mode, [Hold] Modify other buttons
## R2 - Interact / Right-Click, [L2] Sense Heading
##      [L1] Shift-right-click, [R1] Ctrl-right-click, [L1+R1] Alt-right-click
##
## L3 - [Tap] Auto run, [L2] Lock movement (aka auto-strafe-run)
##      [Hold] Re-center 1st-person camera
## R3 - Jump, [L2] Crouch
## Start - Menus Mode (custom choices for L2+Start like Inventory and Bags)
## Select - Custom choices for tap, hold, L2+tap, L2+hold
################################################################################

[Scheme]
LStick = ${CamSteer ? MoveAndLook : MoveStrafe}
RStick = Move mouse

Square = Attack
Tap Circle = Cancel
Hold Circle = Sit
Triangle = Hold ActionModeQuickSelect layer
Hold Triangle = Reset ${AbilityMenu}
Tap PS-X = Add WantMouseCursor layer

Tap L1 = TargetCycleGroup
Tap R1 = TargetCycleNPC, pause 100, Consider
Tap L2 = Add MacrosMode layer
Tap R2 = Interact

Tap L3 = AutoRun
Hold L3 = CenterCamera
R3 = Jump
Tap Start = Add MenuMode layer
Hold Start = ${HoldStartKeybind}
Tap Select = ${TapSelectKeybind}
Hold Select = ${HoldSelectKeybind}

; Holding these shoulder buttons acts as modifiers for other buttons
L1 = Hold L1Held layer
L2 = Hold L2Held layer
R1 = Hold R1Held layer

; Outside of CursorMode, default to controlling camera (via mouse-look)
Mouse = ${AutoLookMode == Stationary ? LookAuto : LookTurn}
; ..but start out with cursor control initially for Windows, login, etc
AutoLayers = CursorMode, LStickNeutral, RStickNeutral
; Alternate face button layout if want one more true to EQOA
ButtonSwap = ${ButtonMap = EQOA ? Square with PS-X, Circle with Triangle : None}


################################################################################
## L2 MODIFIER
##
## Holding L2 acts like a "shift key" that changes what many other buttons do,
## with no particular unifying theme for what L2 means as a whole - it should
## just be considered a way to access a second set of buttons.
################################################################################

[Layer.L2Held]
DPad = MouseWheel
; Use Windows Magnifier if WinMag set to true
DPad Left = ${WinMag ? Win-Minus}
DPad Right = ${WinMag ? Win-Plus}
L1 = TargetLast
Tap R1 = TargetCyclePC, pause 100, WhoTarget
R2 = Heading
L3 = Defer to lower layers
Tap L3 = Lock movement
R3 = Crouch
Tap Start = ${TapL2StartKeybind}
Hold Start = ${HoldL2StartKeybind}
Tap Select = ${TapL2SelectKeybind}
Hold Select = ${HoldL2SelectKeybind}

; Allow rotating camera without turning - even during auto-run - by holding L2
[Layer.L2Held+LStickNeutral]
Mouse = LookOnly
; ...except if in CursorMode of course
[Layer.L2Held+LStickNeutral+CursorMode]
Mouse = Cursor


################################################################################
## ACTION MODE
##
## This mode is activated by pressing Triangle or just moving with LStick.
##
## Use D-Pad to select and Triangle to use an Ability via an overlay menu.
##
## How D-Pad works and Ability selection displayed depends on variables set
## via the Settings menu (AbilityMenu, AbilityHUD, etc).
##
## Hold Triangle for a moment to quickly jump to Ability1, or hold it and use
## the D-Pad at the same time to jump selection 5x as fast.
##
## Use R2 to open doors, interact with shopkeepers, and most importantly loot
## corpses, via Interact key bind. After using R2 to loot a corpse you can press
## R2 repeatedly in order to take all the items found. Note that Interact won't
## loot your own corpse for some reason (as of this writing), but you can set up
## a macro to do so from the Macros Menu and trigger quick looting that way.
################################################################################

[Layer.ActionMode]
DPad = Select item in ${AbilityMenu} with wrapping
Triangle = Defer to lower layers
Tap Triangle = Confirm current selection in ${AbilityMenu}
; Quickly jump back to primary ability menu by holding perp direction briefly
Hold DPad Left = ${AbilMenuVert ? ${AbilityMenu} back}
Hold DPad Right = ${AbilMenuVert ? ${AbilityMenu} back}
Hold DPad Up = ${AbilMenuHoriz ? ${AbilityMenu} back} 
Hold DPad Down = ${AbilMenuHoriz ? ${AbilityMenu} back} 

ShowMenus = ${AbilityHUD}
AutoLayers = Remove CursorMode, MenuMode, BookMode, and ScribeMode

[Layer.ActionModeQuickSelect]
Parent = ActionMode
DPad Left = ${AbilMenuVert ? Defer : Select item Left 5 in ${AbilityMenu}}
DPad Right = ${AbilMenuVert ? Defer : Select item Right 5 in ${AbilityMenu}}
DPad Up = ${AbilMenuHoriz ? Defer : Select item Up 5 in ${AbilityMenu}}
DPad Down = ${AbilMenuHoriz ? Defer : Select item Down 5 in ${AbilityMenu}}


################################################################################
## MENU MODE
##
## This mode is activated by pressing Start/Options/Menu.
##
## Use D-pad to select and X to confirm a menu option. Circle backs out.
##
## Pressing any direction on Right Analog Stick switches to Cursor Mode.
## This is useful after using a menu option that toggles an in-game UI Window.
################################################################################

[Layer.MenuMode]
DPad = Select item in Manage menu using wrapping
PS-X = Confirm current selection in Manage menu
Tap Circle = Go back in Manage menu
Circle = Defer to lower layers
Tap Start = Add RestoreBasicMode layer
Start = Defer to lower layers
R2 = Add RestoreBasicMode layer

ShowMenus = Manage, ${CommandWinShown ? CommandsMask}
AutoLayers = Remove WantMouseCursor, CursorMode, MacrosMode, BookMode, and ActionMode
Auto = Reset Manage
ButtonSwap = ${ButtonMap = EQOA ? Circle with Triangle : None}

[Layer.SettingsMenuMode]
DPad = Select in Settings menu w/ wrap
DPad Left = Confirm current selection in Settings menu
DPad Right = Confirm current selection in Settings menu
PS-X = Confirm current selection in Settings menu
Tap Circle = Go back in Settings menu
Circle = Defer to lower layers

Parent = MenuMode
ShowMenus = Show Settings, Hide Manage and CommandsMask
Auto = Reset Settings menu


################################################################################
## MACROS MODE
##
## This mode is activated with a tap (not hold!) of L2.
##
## This displays 4 menu options at a time, one for each D-Pad direction.
## Pressing a direction immediately opens another 4-directional sub-menu OR
## executes a command - usually a chat box string or slash command.
##
## This enables a large amount of possible commands to be executed quickly by
## "dialing in" a direction sequence, like L2->U->L->D to warn of a train, or
## L2->U->U to hail an NPC. With time most sequences will become muscle memory.
##
## Edit/add/remove macros/sub-menus by holding a D-pad direction for a time.
################################################################################

[Layer.MacrosMode]
Tap DPad = Select item in Macros menu
Hold DPad 800 = Edit Macros menu item in direction
Tap Circle = Go back in Macros menu
Circle = Defer to lower layers

Press Triangle = Remove this layer
Triangle = Defer to lower layers
Tap Triangle = Add ActionMode layer
Press L2 = Remove this layer
L2 = Hold L2Held layer

ShowMenus = Macros
AutoLayers = RestoreBasicMode
Auto = Reset Macros menu


################################################################################
## CURSOR MODE
##
## When mode is activated by pressing X, R2, or moving the Right Analog STick
## while in Menu mode. You will also need to stop holding any direction on the
## Left Analog Stick (can use auto-run to move while using the cursor).
##
## Use Right Analog Stick and D-Pad to move the mouse cursor.
## X = left-click and R2 = right-click.
## L1+X/R2 = shift-click, R1+X/R2 = ctrl-click, and L1+R1+X/R2 = alt-click
##
## RStick gives finer control, D-Pad jumps quickly - but can home in on nearby
## hotspots (e.g. Loot/Inventory slots) for fast and precise cursor movement.
##
## While holding X, LStick moves the cursor (since right thumb is busy).
##
## No overlay menus are available like in the other modes, to prevent any
## from obscuring the in-game interface that might be clicked on.
################################################################################

[Layer.CursorMode]
Mouse = Cursor
DPad = Select Hotspot
PS-X = Hold LeftClickAndDrag layer
R2 = RMB

Hotspots = Commands, AbilityBar, HotBar, LootWindow, ${MiniInvShown ? MiniInv : Inventory}
AutoLayers = Remove WantMouseCursor, ActionMode, MenuMode, and BookMode
Tap R2 = SignalRightClick
Tap PS-X = SignalLeftClick

[Layer.CursorMode+L1Held]
PS-X = Hold ShiftClickAndDrag layer
R2 = Shift+RMB
[Layer.CursorMode+R1Held]
PS-X = Hold CtrlClickAndDrag layer
R2 = Ctrl+RMB
[Layer.CursorMode+L1Held+R1Held]
PS-X = Hold AltClickAndDrag layer
R2 = Alt+RMB

[Layer.LeftClickAndDrag]
Auto = LMB
LStick = Mouse
[Layer.ShiftClickAndDrag]
Auto = Shift+LMB
LStick = Mouse
[Layer.CtrlClickAndDrag]
Auto = Ctrl+LMB
LStick = Mouse
[Layer.AltClickAndDrag]
Auto = Alt+LMB
LStick = Mouse


################################################################################
## TARGET GROUP
##
## Tap L1 to target the default group target (yourself), or tap it repeatedly
## to cycle through targeting each group member slot.
##
## A yellow circle appears to indicate which group member is "last targeted",
## which in turn determines which group member is cycled to for next L1 press.
## When this is not displayed, next L1 resets to default target (self) again.
##
## Hold L1 and use the D-Pad for expanded group targeting functionality:
##
##   L1 + Up/Down  = Previous / Next group member
##   L1 + Right    = Cycle targeting last group member and their pet
##   L1 + Left     = Set last group member as default target instead of self
##                   (like main tank for a healer or main assist for a DPS)
##
## Assist: Hold L1 and press R1 to assist your current target.
## Or: If the yellow indicator is visible, simply press R1 to assist once.
##
## NOTE: The app has no means of reading current group size from the game, but
## you can manually set it for faster cycling via Start->Group Size.
################################################################################

[Layer.L1Held]
DPad Up = TargetCycleGroup previous
DPad Down = TargetCycleGroup next
DPad Right = TargetCycleGroup repeat
DPad Left = Add SetDefaultGroupTarget layer
Tap R1 = Assist, pause 100, Consider
R1 = Hold R1Held layer
ShowMenus = TargetGroupDefault

[Scheme]
When TargetSelf = Add TargetGroupMode layer
When TargetParty# = Add QuickAssist layer

[Layer.TargetGroupMode]
ShowMenus = TargetGroupLast
Release Auto = Reset TargetCycleGroup

[Layer.QuickAssist]
Parent = TargetGroupMode
Tap R1 = Assist, pause 100, Consider
R1 = Defer to lower layers
When TargetSelf = Remove this layer


################################################################################
## CORPSE DRAG MODE
##
## This mode can be activated via a menu item.
## It is used to be able to spam the /corpse macro using the L1 button so can
## move and look with both thumbs on stick while dragging a corpse.
## Hold L1 + D-pad for options for actually looting the corpse.
################################################################################

[Layer.CorpseDragMode]
Tap L1 = DragCorpse
L1 = Hold CorpseLootMenu layer

ShowMenus = CorpseLootMenu
AutoLayers = Remove TargetGroupMode, ScribeMode

[Layer.CorpseLootMenu]
Tap DPad = Select item in CorpseLootMenu menu
Hold DPad 800 = Edit CorpseLootMenu menu item in direction


################################################################################
## ABILITY BOOK MODE
##
## Accessible from the Main Menu in various forms, this allows for faster use
## of the ability book by using the D-pad+X to memorize/arrange/scribe.
##
## You can also use analog L/R or L1/R1 to flip through the ability book pages,
## and can hold R2 to inspect an ability (R2+RStick to scroll description).
################################################################################

[Layer.BookMode]
DPad = Select in AbilityBook w/ wrap
PS-X = Confirm current selection in AbilityBook menu
Circle = Go back in AbilityBook menu
L1 = BookPageLeft
R1 = BookPageRight
R2 = Hold InspectAbility layer
RStick Left = BookPageLeft
RStick Right = BookPageRight
LStick = Defer to lower layers
LStick Left = BookPageLeft
LStick Right = BookPageRight

Mouse = Cursor
ShowMenus = AbilityBook, BookLayoutLabel
AutoLayers = OpenBook, Remove WantMouseCursor, CursorMode, MenuMode, and ActionMode
Release Auto = Add AutoCloseBook layer
ButtonSwap = ${ButtonMap = EQOA ? Circle with Triangle : None}

[Layer.InspectAbility]
Press Auto = Alt-LCLick
Auto = Move cursor to DescPanelCenter
DPad = MouseWheel
RStick = MouseWheel
Release Auto = LClick DescPanelClose, LClick MouseLookStart
ShowMenus = Hide AbilityBook, BookLayoutLabel, MemAbilitySlots, AbilityBarMask


################################################################################
## MEMORIZE ABILITIES
##
## This version of Book Mode is for memorizing abilities. After selecting one
## with X, a sub menu opens allowing you to select which spot to memorize to.
################################################################################

[Layer.MemAbilities]
Parent = BookMode
ShowMenus = ${MemSlotMenu = MemAbilitySlots ? "MemAbilitySlots, AbilityBarMask"}

[Layer.MemAbilities+BookSlotSelected]
Press Auto = Left-click
Auto = Add MemAbilitySlots layer

[Layer.MemAbilitySlots]
DPad = Select in ${MemSlotMenu} w/ wrap
PS-X = Confirm ${MemSlotMenu}
Circle = Remove this layer
Tap R2 = Remove this layer

Parent = MemAbilities
ShowMenus = ${MemSlotMenu} ${AllowQuickCast ? QuickMem} Hide BookLayoutLabel
; Display icon of what ability is being memorized
Auto = ${MemSlotMenu = MemAbilitySlots ? Slide cursor to DisplayAbilityToMem}
; Clear ability off cursor by clicking blank part of screen
Release Auto = LClick at MouseLookStart


################################################################################
## ORGANIZE ABILITIES
##
## This version of Book Mode is for rearranging abilities. Press X to pick up
## an ability (put it on your cursor) then X again in a different slot to swap.
################################################################################

[Layer.OrganizeAbilites]
Parent = BookMode

[Layer.OrganizeAbilites+BookSlotSelected]
Press Auto = Right-click


################################################################################
## SCRIBE ABILITIES
##
## This mode makes Square (attack) toggle the Book Mode on and off, so you can
## pick up an ability scroll in your inventory with Cursor Mode, tap Square and
## use D-Pad + X to select a location to scribe it into. You can then mem the
## ability right after, or use Square again to close the book and scribe more.
################################################################################

[Layer.ScribeMode]
Square = Replace CursorMode with ScribeToBook
AutoLayers = Remove CorpseDragMode
ShowMenus = ScribeModeLabel

[Layer.ScribeMode+BookMode]
Square = Add RestoreBasicMode layer
ShowMenus = Hide ScribeModeLabel

[Layer.ScribeToBook]
Parent = BookMode

[Layer.ScribeToBook+BookSlotSelected]
Press Auto = Left-click
Auto = Replace ScribeToBook with MemAbilities


################################################################################
## QUICK CAST ABILITIES
##
## If you've enabled the 'AllowQuickCast' setting, abilities can also be used
## by holding L2 and then pressing different combinations of 2 face buttons,
## such as "(Hold L2)Triangle->Square" to use a specific ability.
##
## Release L2 and re-press it to reset the sequence, or press the last button
## again to re-cast the same ability (such as when a spell fizzles). A visual
## menu will appear while holding L2 to show what each button will do.
##
## The same menu and controls work during ability memorization. You can assign
## an ability to a slot using the same (Hold L2)button->button sequence.
################################################################################

[Layer.L2Held]
AutoLayers = ${AllowQuickCast ? UseQuickCastMenu}

[Layer.UseQuickCastMenu]
FPad = Select in QuickCast menu
Parent = L2Held
ShowMenus = QuickCast
Auto = Reset QuickCast menu
ButtonSwap = None

[Layer.MemAbilities]
Press L2 = ${AllowQuickCast ? Confirm AbilityBook}
L2 = ${AllowQuickCast ? Hold TryQuickMem layer}
Release L2 = ${AllowQuickCast ? Remove MemAbilitySlots layer}

[Layer.MemAbilitySlots]
L2 = ${AllowQuickCast ? Hold TryQuickMem layer}

; Need both TryQuickMem and MemAbilitySlots active to actually do quick mem
[Layer.TryQuickMem]
Auto = Do nothing

[Layer.TryQuickMem+MemAbilitySlots]
FPad = Choose option in QuickMem menu
; Disable normal MemAbilitySlots controls
DPad = Do nothing
ShowMenus = QuickMem, Hide BookLayoutLabel
Release Auto = Reset QuickMem menu
ButtonSwap = None


################################################################################
## LAYER MAGEMENT / UTILITY LAYERS
##
## This section mostly doesn't include input assignments, instead focusing on
## commands needed to make other layers work correctly - mostly via adding or
## removing other layers based on certain conditions.
################################################################################

; This determines priority of the main "mode" layers when mmultiple are active
[Layer.CursorMode]
Priority = 1
[Layer.ActionMode]
Priority = 2
[Layer.MenuMode]
Priority = 3
[Layer.TargetGroupMode]
Priority = 4
[Layer.CorpseDragMode]
Priority = 5
[Layer.BookMode]
Priority = 6
[Layer.MacrosMode]
Priority = 7

; Empty layers used purely to trigger combo layers in certain conditions
[Layer.R1Held]
Auto = Do nothing
[Layer.LStickPressed]
Auto = Do nothing
[Layer.LStickNeutral]
Auto = Do nothing
[Layer.RStickPressed]
Auto = Do nothing
[Layer.RStickNeutral]
Auto = Do nothing
[Layer.BookSlotSelected]
Auto = Remove this layer

; Track if pressing analog sticks in any direction (mostly for WantMouseCursor)
[Scheme]
Press LStick = Replace LStickNeutral layer with LStickPressed layer
Release LStick = Replace LStickPressed layer with LStickNeutral layer
Press RStick = Replace RStickNeutral layer with RStickPressed layer
Release RStick = Replace RStickPressed layer with RStickNeutral layer

; Always add ActionMode when move character
When Move = Add ActionMode layer

; This waits until stop using analog sticks then switches to cursor mode
; It shows a preview of where cursor will go, and aborts after 1.5 seconds
[Layer.WantMouseCursor]
Hold Auto 1500 = Remove this layer
ShowMenus = CursorPosPreview
; Activate requested cursor mode once stop using analog sticks
; Note how auto-run does NOT prevent cursor mode from starting!
[Layer.WantMouseCursor+LStickNeutral+RStickNeutral]
AutoLayers = CursorMode

; Makes sure either ActionMode or CursorMode is set, and if not sets one
; according to LStickNeutral (cursor) vs LStickPressed (action)
[Layer.RestoreBasicMode]
Hold Auto 100 = Replace this layer with CursorMode layer
[Layer.RestoreBasicMode+CursorMode]
Auto = Remove RestoreBasicMode layer
[Layer.RestoreBasicMode+ActionMode]
Auto = Remove RestoreBasicMode layer
[Layer.RestoreBasicMode+LStickNeutral]
Hold Auto 1 = Replace RestoreBasicMode with CursorMode layer
[Layer.RestoreBasicMode+LStickPressed]
Hold Auto 1 = Replace RestoreBasicMode with ActionMode layer

; Once MenuMode starts, wait until stop using analog sticks to show cursor
[Layer.MenuMode+LStickNeutral+RStickNeutral]
AutoLayers = MenuModeCursorReady
[Layer.MenuModeCursorReady]
Parent = MenuMode
Mouse = Cursor
; For SettingsMenuMode, hide the cursor but still be ready for RStick to move
[Layer.SettingsMenuMode+MenuModeCursorReady]
Mouse = Hide
; Swap from MenuMode to CursorMode if press RStick or D-pad left/right
[Layer.MenuMode+MenuModeCursorReady+RStickPressed]
Auto = Replace MenuMode with CursorMode
[Layer.MenuMode+MenuModeCursorReady]
DPad = Defer to lower layers
Press DPad Left = Replace MenuMode with CursorMode
Press DPad Right = Replace MenuMode with CursorMode
DPad Left = Select Hotspot Left
Dpad Right = Select Hotspot Right

; Request cursor control when use any UI-window-opening key bind in Action Mode
[Layer.ActionMode]
When Inventory = Add WantMouseCursor layer
When Bags = Add WantMouseCursor layer
When Book = Add WantMouseCursor layer
When Skills = Add WantMouseCursor layer
When Social = Add WantMouseCursor layer
When Journal = Add WantMouseCursor layer
When Guild = Add WantMouseCursor layer
When MainMenu = Add WantMouseCursor layer
When MiniInventory = ${MiniInvShown = false ? Add WantMouseCursor layer}

; Restore cursor control if possibly trying to exit the game
[Scheme]
When MainMenu = Add WantMouseCursor layer
When Camp = Add WantMouseCursor layer
When CampToDesktop = Add WantMouseCursor layer
When QuickExit = Add WantMouseCursor layer

; Request cursor and jump it to LootWindow when likely trying to loot a corpse,
; and allow a rapid looting of a full corpse by just tapping R2 repeatedly.
When Interact = Add WantQuickLoot layer
When LootTarget = Add WantQuickLoot layer
When LootNearestCorpse = Add WantQuickLoot layer
When LootOwnCorpse = Add WantQuickLoot layer
[Layer.WantQuickLoot]
Parent = WantMouseCursor
Auto = Jump cursor to LootWindow1
[Layer.WantQuickLoot+CursorMode]
AutoLayers = Add QuickLoot, Remove WantQuickLoot
[Layer.QuickLoot]
Parent = CursorMode
Auto = Temp set NextLootSlotNum to 2
Release Auto = Temp set NextLootSlotNum to 1
AutoLayers = Remove CorpseDragMode
ShowMenus = QuickLootPreview
R2 = Defer to lower layers
Hold R2 = Remove this layer
When Press DPad = Remove this layer
When Press RStick = Remove this layer
When Press PS-X = Remove this layer
When SignalRightClick = Add ${NextLootSlotNum > 8 ? QuickLootEnd : QuickLootSlot} layer
[Layer.QuickLootSlot]
Press Auto = Move cursor to LootWindow${NextLootSlotNum}
Auto = Remove this layer
Release Auto = Temp set NextLootSlotNum to ${NextLootSlotNum+1}
[Layer.QuickLootEnd]
Parent = QuickLoot
Press Auto = Move cursor to LootWindow9
Auto = Temp set NextLootSlotNum to 1
Tap R2 = Replace this layer with QuickLootReset
[Layer.QuickLootReset]
Press Auto = Temp set NextLootSlotNum to 1
Auto = Replace this layer with QuickLootSlot
Release Auto = MouseWheel Down 12

; Reset group targeting when do anything that might target anything else
[Layer.TargetGroupMode]
When TargetCycleNPC = Remove this layer
When TargetCyclePC = Remove this layer
When TargetNearestNPC = Remove this layer
When TargetNearestPC = Remove this layer
When TargetLast = Remove this layer
When TargetNearestPlayerCorpse = Remove this layer
When LootNearestCorpse = Remove this layer
When LootOwnCorpse = Remove this layer
When Interact = Remove this layer
When Assist = Remove this layer
When Cancel = Remove this layer
When SignalLeftClick = Remove this layer
When SignalRightClick = Remove this layer

; Hide default group target indicator once active target indicator is shown
[Layer.TargetGroupMode+L1Held]
AutoLayers = HideDefaultGroupTarget

; L1+X (or L1+R1+X) should also hide default group target indicator,
; since that's clearly not what L1 is being held down for now
[Layer.CursorMode+L1Held]
When press PS-X = Add HideDefaultGroupTarget layer
[Layer.CursorMode+L1Held+R1Held]
When press PS-X = Add HideDefaultGroupTarget layer

; Hides default group target indicator from above - removed when L1 released
[Layer.HideDefaultGroupTarget]
ShowMenus = Hide TargetGroupDefault
Parent = L1Held

; Sets default group target from L1+D-Left, and also forces the indicator
; to show even if HideDefaultGroupTarget above is active, until L1 released
[Layer.SetDefaultGroupTarget]
Auto = Set TargetCycleGroup default to last key pressed
DPad Left = Set TargetCycleGroup default to last key pressed
ShowMenus = Show TargetGroupDefault
Parent = HideDefaultGroupTarget

; The game immediately cancels /follow if are holding RMB for mouse-look mode,
; even if don't move the mouse. This prevents that by temporarily releasing RMB.
[Scheme]
When AutoFollow = Add AutoFollowActive layer
[Layer.AutoFollowActive]
When Move = Remove this layer
[Layer.ActionMode+AutoFollowActive]
Mouse = LookOnly

; This makes holding L1+R1 also hold Alt after a short delay,
; which in turn causes the game to show item names.
[Layer.L1Held+R1Held]
AutoLayers = DelayedShowNames
[Layer.CursorMode+L1Held+R1Held]
When press PS-X = Remove DelayedShowNames layer
[Layer.DelayedShowNames]
Parent = L1Held+R1Held
Hold Auto 500 = Add ShowNames layer
[Layer.ShowNames]
Parent = DelayedShowNames
Auto = Alt

; Use book hotspots instead of inventory/loot when use Book key bind
; Return to normal hotspots when do anything that closes the book
[Scheme]
When Book = Add BookHotspots layer
[Layer.BookHotspots]
When Move = Remove this layer
When AutoRun = Remove this layer
When Sit = Remove this layer
When Jump = Remove this layer
When Attack = Remove this layer
[Layer.BookHotspots+CursorMode]
Hotspots = Enable AbilityBook, Disable Inventory, MiniInv, and LootWindow
[Layer.BookHotspots+AllInventoryHotspots]
Hotspots = Disable Inventory and MiniInv

; Allow both MiniInventory and Inventory hotspots at the same time ONLY if
; use the Inventory button while MiniInventory is already open, so they don't
; interfece with each other otherwise when only one of them is likely open.
[Scheme]
When Inventory = ${MiniInvShown ? Add AllInventoryHotspots layer}
[Layer.AllInventoryHotspots]
When MiniInventory = Remove this layer
[Layer.AllInventoryHotspots+CursorMode]
Hotspots = Inventory, MiniInv

; Jump cursor to MiniInventory window when it is opened
[Scheme]
When MiniInventory = Add ToggleMiniInventory layer
[Layer.ToggleMiniInventory]
Press Auto = ${MiniInvShown = false ? Jump cursor to MiniInv1}
Auto = Remove this layer
Release Auto = Temp set MiniInvShown to ${MiniInvShown ? false : true}

; Allow closing MiniInventory window by using cancel button (circle)
[Scheme]
Tap Circle = ${ReadyToCloseMiniInv ? MiniInventory : Cancel}

; These just swap the BookLayout variable along with clicking in-game button
[Layer.BookSwapToSkillsLayout]
Press Auto = Left-click
Auto = Remove this layer
Release Auto = Temp set BookLayout to Skills
[Layer.BookSwapToInnatesLayout]
Press Auto = Left-click
Auto = Remove this layer
Release Auto = Temp set BookLayout to Innates
[Layer.BookSwapToSpellsLayout]
Press Auto = Left-click
Auto = Remove this layer
Release Auto = Temp set BookLayout to Spells

; This makes sure the ability book is open when BookMode layer is active
; (by using Sit first to force it to close if it was already open),
; and tries to make in-game book and the layer/menu close at the same time.
[Layer.OpenBook]
Parent = BookMode
Auto = Sit, wait 100, Book
When Book = Replace this layer with BookIsOpen
[Layer.BookIsOpen]
When Move = Replace this layer with RestoreBasicMode
When AutoRun = Replace this layer with RestoreBasicMode
When Jump = Replace this layer with RestoreBasicMode
When Attack = Replace this layer with RestoreBasicMode
When Sit = Replace this layer with RestoreBasicMode
; Auto-close book when requested, unless the book was already
; previosly closed by above removing BookIsOpen layer early
[Layer.AutoCloseBook]
Auto = Remove this layer
[Layer.BookIsOpen+AutoCloseBook]
Press Auto = Remove BookIsOpen layer
Auto = Sit

; Use AutoLook after have used Sit key bind, until next time move
[Layer.SitAndLook]
Priority = -1
Mouse = LookAuto
When Press LStick = Remove this layer
When AutoRun = Remove this layer
[Layer.BookHotspots]
AutoLayers = ${AutoLookMode = Sitting ? SitAndLook}
[Scheme]
When Sit = ${AutoLookMode = Sitting ? Add SitAndLook layer}

; Used to cycle Hotbar Banks in macros menu but restore to default when done
[Layer.MacroMenusResetHotBank]
Parent = MacrosMode
Press Auto = HotBank0
Release Auto = HotBank0
[Layer.MacrosMenuNextHotBank]
Parent = MacroMenusResetHotBank
Press Auto = HotBankCycle next
Auto = Remove this layer


