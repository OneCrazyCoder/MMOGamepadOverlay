ParentProfile = MnM_Default

# For a breakdown of the base controls, read the generated _Default.ini file! #
; - Lines that start with ; or # are comments and are ignored by the app

###############################################################################
## Set these with your actual in-game keybinds, and add any keys you
## have changed from game defaults here with the key you have assigned.
## See the _Base.ini file for the names of key binds you can assign
###############################################################################

[KeyBinds]
# Adding Strafe keybinds is optional, but doing so will improve responsiveness
# of movement controls. BE SURE TO ASSIGN THESE IN-GAME TO THE SAME THING!
StrafeLeft =
StrafeRight =

# HIGHLY RECOMMENDED you un-comment (remove ; character) the two below and put
# in-game /macros for these on your hot bar for each character. They will still
# work regardless but controls can become unresponsive from manually using the
# chat box entry field every time you use these common commands.
;WhoTarget = Hotbutton12
;DragCorpse = Hotbutton11

# This will be used when you press R2 while holding L2 - set to whatever you
# want, but the intent is to have it trigger Sense Heading on your hotbar.
# Nothing happens with L2+R2 otherwise since there's no /senseheading command
;Heading = Hotbutton10

# Less important than above, but may still want to put these on use your hotbar
;TargetNearestCorpse = HotButton9
;AutoFollow = HotButton8
;LootTarget = HotButton7

# If you want to use multiple hotbar banks, it is recommended you un-comment the
# below lines and remap the in-game keybinds to match (or choose different keys
# entirely), because the default shift+numpad# keys don't work reliably.
;HotBank0 = Num0
;HotBank1 = Num1
;HotBank2 = Num2
;HotBank3 = Num3
;HotBank4 = Num4
;HotBank5 = Num5
;HotBank6 = Num6
;HotBank7 = Num7
;HotBank8 = Num8
;HotBank9 = Num9


###############################################################################
## Make sure this is a position of the screen that will NEVER have any UI
## elements (windows) covering it (usually a corner works best)
###############################################################################

[Hotspots]
MouseLookStart = L, T


###############################################################################
## Default control scheme has nothing set for the Select/Back/Share button,
## since in EQOA it changed camera view - which this game has no key bind for.
## Set it to do whatever you like here!
###############################################################################

[Scheme]
Tap Select = Screenshot
Hold Select = ToggleUI

[Layer.L2Held]
Tap Select = GameStats
Hold Select = ToggleMusic


###############################################################################
## These categories are often updated by the control scheme automatically when
## set settings or use the layout editor.
###############################################################################

[Variables]

[Hotspots]

[System]


###############################################################################
## NOTE:
## Remember you can also change the macros in the Macros menu at runtime
## by holding a direction on the D-Pad while in the Macros (tap L2) menu.
###############################################################################
