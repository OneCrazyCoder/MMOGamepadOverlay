[KeyBindCycles]
; Allow for cycling through self + group targets with just one key
TargetCycleGroup = ${GroupSize}: TargetSelf, TargetGroup1-5
; Allow for cycling through hotbar pages with next and prev
HotPageCycle = ${HotbarPageCount}, 2: HotPage1-10

[Hotspots]
; Want this in a spot where there's unlikely to be any UI windows
MouseLookStart = R, B
; Want this to be somewhere that cursor isn't visible
MouseHidden = R, B
; Used to display indicator for self being targeted
TargetSelf = ${MyWinX} + ${TargetSelfX}, ${MyWinY} + ${TargetSelfY}

[Hotspots.TargetGroup]
; Used to display indicator for group member last targeted
Anchor = ${GroupWinX}, ${GroupWinY}
1-5 = ${TargetGroup1X}, ${TargetGroup1Y} : +0, ${TargetGroupDY}

[Hotspots.SpellBook]
; Used for spell memorization menu for icons in spell book
Anchor = ${BookWinX}, ${BookWinY}, 40, 40
1-8 = ${BookSpell1X}, ${BookSpell1Y} : ${BookSpellDX} @ 4, ${BookSpellDY}
9-16 = ${BookSpell9X}, ${BookSpell9Y} : ${BookSpellDX} @ 4, ${BookSpellDY}

[Hotspots.SpellSlot]
Anchor = ${SpellGemsWinX}, ${SpellGemsWinY}, ${SpellGemW}, ${SpellGemH}
1-8 = ${SpellGem1X}, ${SpellGem1Y} : ${SpellGemDX}, ${SpellGemDY}

[Hotspots.SpellName]
; Used for copying spell names on UI's that include them
Anchor = ${SpellGemsWinX}, ${SpellGemsWinY}, ${SpellNameW}, ${SpellNameH}
1-8 = ${SpellName1X}, ${SpellName1Y} : ${SpellNameDX}, ${SpellNameDY}

[Hotspots.Hotbar]
; Primarily used for copying hotbar icons
Anchor = ${HotbarWinX}, ${HotbarWinY}, ${HotButtonW}, ${HotButtonH}
1-10 = ${HotButton1X}, ${HotButton1Y} : ${HotButtonDX}, ${HotButtonDY} @ 2

[Hotspots.LootWindow]
Anchor = ${LootWinX}, ${LootWinY}
1-16 = ${LootWin1X}, ${LootWin1Y} : ${LootWinDX}, ${LootWinDY} @ ${LootWinColCount}
17-32 = ${UISkin = duxaui ? "${LootWin1X}, ${LootWin1Y + ${LootWinDY * 2}} : ${LootWinDX}, ${LootWinDY} @ ${LootWinColCount}"}

[Hotspots.Inventory]
Anchor = ${InvWinX}, ${InvWinY}
1-8 = +180, +189 : +39 @ 4, +39
Armor1-5 = +62, +23 : +39, +0
Armor6-17 = +23, +62 : +39, +39 @ 6
Weapons1-4 = +101, +140 : +39, +0
Coins1-4 = +128, +194 : +0, +39
Skills = +269, +12
Destroy = +298, +382

[Hotspots.InvDuxa]
Anchor = ${InvWinX}, ${InvWinY}
1-8 = +196, +210 : +44 @ 4, +44
Armor1-5 = +72, +40 : +42, +0
Armor6-17 = +30, +82 : +42, +42 @ 6
Weapons1-4 = +112, +168 : +42, +0
Coins1-4 = +134, +202 : +0, +24
Skills = +135, +325
Destroy = +135, +350

[Hotspots.ExtraDuxa]
; Extra inventory slots shown in hotbar window in duxaui
Anchor = ${HotbarWinX}, ${HotbarWinY}
1-12 = +112, +25 : +41, +41 @ 2

[LabelIcons]
Spell1-8 = SpellSlot#
SpellName1-8 = SpellName#
Hotbar1-10 = Hotbar#

[Appearance]
ItemRGB = ${UISkin = duxaui ? "43, 43, 43" : "196, 188, 174"}
BorderRGB = ${UISkin = duxaui ? "0, 0, 0," : "107, 103, 93"}
