[KeyBindCycles]
; Allow for cycling through self + group targets with just one key
TargetCycleGroup = ${GroupSize}: TargetSelf, TargetParty1-5
; Allow for cycling through hotbar pages with next and prev
HotBankCycle = ${HotbarBankCount}, 2: HotBank0-9

[Hotspots]
; Want this in a spot where there's unlikely to be any UI windows
MouseLookStart = L, T
; Want this to be somewhere that cursor isn't visible
MouseHidden = R, B
TargetSelf = ${MyWinL} + ${MyWinScale * 140}, ${MyWinT} + ${MyWinScale * 25}

[Hotspots.TargetParty]
; Used for indicator positions when using TargetCycleGroup key bind cycle
; Unfortunately each group member's bar can be a different height, depending
; on if they have a pet or not, so there's no way to position consistently
; for each group member. Thus these are averages to try to at least touch the
; correct group member's box regardless of which have pets and which don't.
Anchor = ${GroupWinL}, ${GroupWinT}
Scale = ${GroupWinScale}
1 = +140, +25
2 = +140, +105
3 = +140, +195
4 = +140, +275
5 = +140, +365

[Hotspots.SpellBook]
Anchor = ${BookWinCX}, ${BookWinCY}, 48, 48
Scale = ${BookWinScale}
; Unfortunately these hotspots won't line up for Innates & Skills =(
1-8 = -177, -155 : +98 @ 4, +82
9-16 = +79, -155 : +98 @ 4, +82
Swap1-3 = -30, +235 : +59, 0
PrevPage = -278, -9, 32, 64
NextPage = +278, -9, 32, 64

[Hotspots.AbilityBar]
Anchor = ${AbilL}, ${AbilT}, ${AbilW}, ${AbilH}
Scale = ${AbilWinScale}
1-10 = ${AbilW / 2}, ${AbilH / 2} : ${AbilDistX}, ${AbilDistY}
Book = ${AbilWinBookX}, ${AbilWinBookY}

[Hotspots.AbilityBarIcon]
Anchor = ${AbilL}, ${AbilT}, ${AbilH}, ${AbilH}
Scale = ${AbilWinScale}
1-10 = ${AbilH / 2}, ${AbilH / 2} : ${AbilDistX}, ${AbilDistY}

[Hotspots.Hotbar]
Anchor = ${HotBarL}, ${HotBarT}, 49, 49
Scale = ${HotbarScale}
1-12 = +27, +27 : +52, +52 @ ${HotBarRowSize}
PrevBank = 12: ${HotBarBankOffX}+38, ${HotBarBankOffY}-12, 6, 6
NextBank = PrevBank: +0, +25

[Hotspots.AuraBar]
Anchor = ${AuraBarL}, ${AuraBarT}, 49, 49
Scale = ${AuraBarScale}
1-10 = +24, +29 : +52, +0

[Hotspots.LootWindow]
Anchor = ${LootWinL}, ${LootWinT}
Scale = ${LootWinScale}
1-8 = +37, +66 : +48, +48 @ 2
[Hotspots]
; Just used for indicater for scrolling down to next block in LootWindow
LootWindow9 = LootWindow: +${LootWinScale * 61}, +${LootWinScale * 247}

[Hotspots.Inventory]
Anchor = ${InvWinL}, ${InvWinT}
Scale = ${InvWinScale}
1-8 = +58, +511 : +58, +0
Bags1-7 = +58, +606 : +58, +0
Armor1-5 = +148, +68 : +58, +0
Armor6-11 = +90, +125 : +0, +58
Armor12-17 = +436, +125 : +0, +58
Weapons1-4 = +173, +414 : +58, +0
Drop = +468, +590
Destroy = +468, +619
Coins1-4 = +135, +657 : +68, +0

[Hotspots.MiniInv]
Anchor = ${MiniInvWinL}, ${MiniInvWinT}
Scale = ${MiniInvWinScale}
1-8 = +40, +40 : +55, +0
Bags1-7 = +40, +100 : +55, +0
Drop = +426, +88
