CommandButtonsOn = ${CommandWinShown ? ${CommandWinCollapsed ? No : Yes} : No}
CommandButton1XOff = ${CommandButtonsOn ? 68}
CommandButton1YOff = ${CommandButtonsOn ? 28}
AbilWinType = 0
AbilWinName = ${AbilWinType ? AbilityBar_${AbilWinType} : AbilityBar_Default}
