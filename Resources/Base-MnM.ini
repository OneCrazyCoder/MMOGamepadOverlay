AbilWinL = R-131
AbilWinT = B-1014
AbilWinScale = 1.0
AbilWinBookSize = ${AbilWinBook ? ${AbilWinType[0:58, 1:30, 2:80]} : 0}
AbilWinMaskL = ${AbilWinType[0:-6, 1:-12, 2:-8]}
AbilWinMaskT = ${AbilWinType[0:-2, 1:-11, 2:-2]}
AbilWinMaskW = ${AbilWinType[0:136, 1:78, 2:${AbilWinBookSize + 497}]}
AbilWinMaskH = ${AbilWinType = 2 ? 67 : ${AbilWinBookSize + 513}}
AbilL = ${AbilWinL + ${AbilWinScale * ${AbilWinType[0:-1, 0]}}}
AbilT = ${AbilWinT + ${AbilWinScale * ${AbilWinType[0:13, 1:4, 2:7]}}}
AbilW = ${AbilWinType[0:122, 1:55, 2:48]}
AbilH = 49
AbilDistX = ${AbilWinType == 2 ? ${AbilW} : 0}
AbilDistY = ${AbilWinType != 2 ? ${AbilH} : 0}
AbilWinBookX = ${AbilWinBook ? ${AbilWinType == 2 ? ${AbilDistX * 10} + ${AbilWinBookSize / 2} : ${AbilW / 2}}}
AbilWinBookY = ${AbilWinBook ? ${AbilWinType != 2 ? ${AbilDistY * 10} + ${AbilWinBookSize / 2} : ${AbilH / 2}}}

; Auto-sync some variables to values in config files written by the game
[TargetConfigFiles]
Settings=%USERPROFILE%\AppData\LocalLow\Niche Worlds Cult\Monsters and Memories\settings.json
Windows=%USERPROFILE%\AppData\LocalLow\Niche Worlds Cult\Monsters and Memories\*windows.json

