ParentProfile = AOA_Base

; Remove below line to stop automatic replacement by newer versions of the app
AutoGeneratedVersion = 0

################################################################################
## BASIC CONTROLS
##
## This control scheme is designed to emulate that used by the PS2 MMO "EQOA".
##
## Additional actions not included in EQOA like jump, sit, and mouse-dependent
## tasks like inventory management needed to be added by things like holding a
## button briefly vs tapping it doing different things, or button combinations
## (usually with L2, such as L2+D-Pad to use mouse wheel for camera zoom or
## scrolling chat window text). Some buttons also have different actions for
## different contextual "modes" - cursor, menu, macros, or action mode.
##
## The face button (ABXY/Tri/Sq/Circ/Cross) assignments were swapped around
## from EQOA's layout to be more like modern games (i.e. Circle instead of
## Triangle for "cancel"), but an option is included to swap these back via
## Start->Overlay->Settings->Gamepad Button Assignments.
##
## Basic Controls:
##
## Left Analog Stick - Move character
## Right Analog Stick - Move mouse (cursor or camera)
## D-Pad - Navigate menus / jump mouse cursor, [L2] Mouse wheel / camera zoom
##
## A - Confirm menu selections / Left-click / Switch to Cursor Mode
##     [L1] Shift-click, [R1] Ctrl-click, [L1+R1] Alt-click
## B - [Tap] Esc/Cancel/Back, [Hold] Sit
## X - [Tap] Attack, [Hold] Consider
## Y - Use Ability / Switch to Action Mode
##     [Hold] Jump to first ability, [D-Pad] Jump 4 ability slots
##
## L1 - Target self/pet/group members (see TARGET GROUP section for details)
## R1 - Target NPCs, [L2] Target PCs
## L2 - [Tap] Switch to Macros Mode, [Hold] Modify other buttons
## R2 - Right-click / Use/Loot Center Screen
##      [L1] Shift-right-click, [R1] Ctrl-right-click, [L1+R1] Alt-right-click
##
## L3 - Auto run, [L2] Lock movement (aka auto-strafe-run)
## R3 - Jump, [L2] Crouch
## Start - Menus Mode (custom choices for L2+Start, like Inventory and Bags)
## Select - Custom choices for tap, hold, L2+tap, or L2+hold
################################################################################

[Scheme]
LStick = MoveAndLook
RStick = Move mouse

Tap X = Attack
Hold X = Consider
Tap B = Cancel
Hold B = Sit
Y = Hold ActionModeQuickSelect layer
Tap A = Add WantMouseCursor layer

Tap L1 = TargetCycleGroup
Tap R1 = TargetCycleNPC
Tap L2 = Add MacrosMode layer
Tap R2 = Interact

L3 = AutoRun
R3 = Jump
Tap Start = Add MenuMode layer
Hold Start = ${HoldStartKeybind}
Tap Select = ${TapSelectKeybind}
Hold Select = ${HoldSelectKeybind}

; Holding these shoulder buttons acts as modifiers for other buttons
L1 = Hold L1Held layer
L2 = Hold L2Held layer
R1 = Hold R1Held layer

; Outside of CursorMode, default to controlling camera (via mouse-look)
Mouse = ${AutoLookMode == Stationary ? LookAuto : LookTurn}
; ..but start out with cursor control initially for Windows, login, etc
AutoLayers = CursorMode, CharacterStationary, MouseStationary, AbilityBars
; Used to aim R2 clicks while controlling camera (to loot/etc)
ShowMenus = ${ShowReticle ? InteractReticle}
; Return to cursor control if alt-tab out of the game
When Focus Lost = Add CursorMode layer
; Alternate face button layout if want one that's more true to EQOA
ButtonSwap = ${ButtonMap = EQOA ? Square with Cross, Circle with Triangle : None}


################################################################################
## L2 MODIFIER
##
## Holding L2 acts like a "shift key" that changes what many other buttons do,
## with no particular unifying theme for what L2 means as a whole - it should
## just be considered a way to access a second set of buttons.
################################################################################

[Layer.L2Held]
DPad = MouseWheel
; Use Windows Magnifier if WinMag set to true
DPad Left = ${WinMag ? Win-Minus}
DPad Right = ${WinMag ? Win-Plus}
Tap R1 = TargetCyclePC
L3 = Lock movement
R3 = Crouch
Tap Start = ${TapL2StartKeybind}
Hold Start = ${HoldL2StartKeybind}
Tap Select = ${TapL2SelectKeybind}
Hold Select = ${HoldL2SelectKeybind}

; Allow rotating camera without turning - even during auto-run - by holding L2
[Layer.L2Held+CharacterStationary+ActionMode]
Mouse = LookOnly


################################################################################
## ACTION MODE
##
## This mode is activated by pressing Y (Triangle) or just moving with LStick.
##
## Use D-Pad to select and Y to use an Ability via an overlay menu.
## How D-Pad works and Ability selection displayed depends on variables set
## via the Start->Overlay->Settings menu.
##
## Hold Y for a moment to quickly jump to first ability, or hold it and use the
## D-Pad at the same time to jump selection 5x as fast.
##
## R2 will use the Interact key bind which left-clicks then right-clicks at the
## InteractHotspot (center screen) to open doors, shop/bank, and loot corpses.
## An optional reticle shows this click location.
################################################################################

[Layer.ActionMode]
Tap R2 = Interact
AutoLayers = Remove CursorMode and MenuMode

[Layer.ActionMode+AbilityHighlight]
DPad = Select item in AbilityHighlight with wrapping
Y = Defer to lower layers
Tap Y = Confirm current selection in AbilityHighlight
ShowMenus = AbilityHighlight

[Layer.ActionMode+AbilityBars]
DPad = Select item in AbilityBars with wrapping
Y = Defer to lower layers
Tap Y = Confirm current selection in AbilityBars
A = Defer to lower layers
Hold A 800 = ${AllowEditAbilBars ? Edit selected AbilityBars item}
; Quickly jump back to primary ability menu by holding perp direction briefly
Hold DPad Left = AbilityBars back
Hold DPad Right = AbilityBars back
ShowMenus = AbilityBars

[Layer.ActionModeQuickSelect]
Parent = ActionMode

[Layer.ActionModeQuickSelect+AbilityHighlight]
DPad Left = Select item Left 5 in AbilityHighlight
DPad Right = Select item Right 5 in AbilityHighlight
DPad Up = Select item Up 5 in AbilityHighlight
DPad Down = Select item Down 5 in AbilityHighlight

[Layer.ActionModeQuickSelect+AbilityBars]
DPad Left = AbilityBars back
DPad Right =AbilityBars back
DPad Up = AbilityBars select Up 5
DPad Down = AbilityBars select Down 5


################################################################################
## MENU MODE
##
## This mode is activated by pressing Start/Options/Menu.
##
## Use D-pad to select and A to confirm a menu option. B backs out.
##
## Pressing any direction on Right Analog Stick switches to Cursor Mode.
## This is useful after using a menu option that toggles an in-game UI Window.
################################################################################

[Layer.MenuMode]
DPad = Select in MainMenu using wrapping
A = Confirm current selection in MainMenu
Tap B = Go back in MainMenu
B = Defer to lower layers
X = Add RestoreBasicMode layer
Tap Start = Add RestoreBasicMode layer
Start = Defer to lower layers
R2 = Add RestoreBasicMode layer

ShowMenus = MainMenu, OverlayMenu
AutoLayers = Remove WantMouseCursor, CursorMode, MacrosMode, and ActionMode
Auto = Reset MainMenu
ButtonSwap = ${ButtonMap = EQOA ? Circle with Triangle : None}

[Layer.OverlayMenuMode]
DPad = Select in OverlayMenu using wrapping
Tap A = Confirm current selection in OverlayMenu
Hold A 800 = ${AllowEditMenus ? Edit current selection in OverlayMenu}
Tap B = Go back in OverlayMenu
B = Defer to lower layers

Parent = MenuMode
ShowMenus = Hide MainMenu
Auto = Confirm OverlayMenu
Release Auto = Reset OverlayMenu

[Layer.SettingsMenuMode]
DPad = Select in Settings menu w/ wrap
DPad Left = Confirm current selection in Settings menu
DPad Right = Confirm current selection in Settings menu
A = Confirm current selection in Settings menu
Tap B = Go back in Settings menu
B = Defer to lower layers

Parent = OverlayMenuMode
ShowMenus = Show Settings, Hide OverlayMenu
Auto = Reset Settings menu

[Layer.EditAbilityBars]
DPad = Select item in AbilityBars with wrapping
A = Edit selection in AbilityBars
Y = Edit selection in AbilityBars
Tap B = Remove this layer
B = Defer to lower layers

Parent = SettingsMenuMode
ShowMenus = AbilityBars


################################################################################
## MACROS MODE
##
## This mode is activated with a tap (not hold!) of L2.
##
## This displays 4 menu options at a time, one for each D-Pad direction.
## Pressing a direction immediately opens another 4-directional sub-menu OR
## executes a command - usually a chat box string or slash command.
##
## This enables a large amount of possible commands to be executed quickly by
## "dialing in" a direction sequence, like L2->U->L->D to warn of a train, or
## L2->U->U to hail an NPC. With time most sequences will become muscle memory.
##
## Edit/add/remove macros/sub-menus by holding a D-pad direction for a time,
## assuming the option is enabled via Overlay Settings.
################################################################################

[Layer.MacrosMode]
Tap DPad = Select item in Macros menu
Hold DPad 800 = ${AllowEditMacros ? Edit Macros menu item in direction}
Tap B = Go back in Macros menu
B = Defer to lower layers

Press Y = Remove this layer
Y = Defer to lower layers
Tap Y = Add ActionMode layer
Press L2 = Remove this layer
L2 = Hold L2Held layer

ShowMenus = Macros
AutoLayers = RestoreBasicMode
Auto = Reset Macros menu


################################################################################
## CURSOR MODE
##
## This mode is activated by pressing A, R2, or moving the Right Analog Stick
## while in Menu mode. You will also need to stop holding any direction on the
## Left Analog Stick (can use auto-run to move while using the cursor).
##
## Use Right Analog Stick and D-Pad to move the mouse cursor.
## A = left-click and R2 = right-click.
## L1+A/R2 = shift-click, R1+A/R2 = ctrl-click, and L1+R1+A/R2 = alt-click
##
## RStick gives finer control, D-Pad jumps quickly - but can home in on nearby
## hotspots (e.g. Loot/Inventory slots) for fast and precise cursor movement.
##
## While holding A, LStick moves the cursor (since right thumb is busy).
##
## No overlay menus are available like in the other modes, to prevent any
## from obscuring the in-game interface that might be clicked on.
################################################################################

[Layer.CursorMode]
Mouse = Cursor
DPad = Select Hotspot
A = Hold LeftClickAndDrag layer
R2 = RMB

Hotspots = Character LootWindow Hotbars MainMenu Spellbar ${InvDocked ? DockedInv : Inventory}
AutoLayers = Remove WantMouseCursor, ActionMode, and MenuMode
ShowMenus = Hide InteractReticle
Tap R2 = SignalRightClick
Tap A = SignalLeftClick

[Layer.CursorMode+L1Held]
A = Hold ShiftClickAndDrag layer
R2 = Shift+RMB
Tap A = SignalLeftClick
Tap R2 = SignalRightClick
[Layer.CursorMode+R1Held]
A = Hold CtrlClickAndDrag layer
R2 = Ctrl+RMB
Tap A = SignalLeftClick
Tap R2 = SignalRightClick
[Layer.CursorMode+L1Held+R1Held]
A = Hold AltClickAndDrag layer
R2 = Alt+RMB
Tap A = SignalLeftClick
Tap R2 = SignalRightClick

[Layer.LeftClickAndDrag]
Auto = LMB
LStick = Mouse
[Layer.ShiftClickAndDrag]
Auto = Shift+LMB
LStick = Mouse
[Layer.CtrlClickAndDrag]
Auto = Ctrl+LMB
LStick = Mouse
[Layer.AltClickAndDrag]
Auto = Alt+LMB
LStick = Mouse


################################################################################
## TARGET GROUP
##
## Tap L1 to target the default group target (yourself), or tap it repeatedly
## to cycle through targeting each group member slot.
##
## A yellow circle appears to indicate which group member is "last targeted",
## which in turn determines which group member is cycled to for next L1 press.
## When this is not displayed, next L1 resets to default target (self) again.
##
## Hold L1 and use the D-Pad for expanded group targeting functionality:
##
##   L1 + Up/Down  = Previous / Next group member
##   L1 + Right    = Cycle targeting last group member and their pet
##   L1 + Left     = Set last group member as default target instead of self
##                   (such as the main tank when playing a healer)
##
## Assist: Hold L1 and press R1 to use current AssistType setting.
##
## NOTE: The app has no means of reading current group size from the game, but
## you can manually set it for faster cycling via Start->Overlay->Group Size.
################################################################################

[Layer.L1Held]
DPad Up = TargetCycleGroup previous
DPad Down = TargetCycleGroup next
DPad Right = TargetCycleGroup repeat
DPad Left = Add SetDefaultGroupTarget layer
Tap R1 = ${AssistType = Target Main Assist ? Assist : AssistTarget}
R1 = Hold R1Held layer
ShowMenus = TargetGroupDefault

[Scheme]
When TargetSelf = Add TargetGroupMode layer
When TargetGroup# = Add TargetGroupMode layer

[Layer.TargetGroupMode]
ShowMenus = TargetGroupLast
Release Auto = Reset TargetCycleGroup


################################################################################
## QUICK CAST
##
## If this option is enabled via Overlay->Settings, spells/etc can also be used
## by holding L2 and then pressing a face button (ABXY/Cross/Circ/Square/Tri).
##
## You may set it to use a 2-button sequences for each action (16 total) such
## as "(Hold L2)Y->A" to use a specific action. In this setup, release L2 and
## press it again to reset the sequence - or press the last button again to
## re-cast the same thing (such as when a spell fizzles).
##
## You can edit the contents of the Quick Cast menu by holding instead of
## tapping the button, if you have that option enabled in Overlay Settings.
################################################################################

[Layer.L2Held]
AutoLayers = ${QuickCastType ? UseQuickCastMenu}

[Layer.UseQuickCastMenu]
Tap FPad = Select ${QuickCastMenu}
Hold FPad 800 = ${AllowEditQuickCast ? Edit ${QuickCastMenu}}
Parent = L2Held
ShowMenus = ${QuickCastMenu}
Auto = Reset ${QuickCastMenu} menu
ButtonSwap = None


################################################################################
## LAYER MANAGEMENT / UTILITY LAYERS
##
## This section mostly doesn't include input assignments, instead focusing on
## commands needed to make other layers work correctly - mostly via adding or
## removing other layers based on certain conditions.
################################################################################

[Layer.CursorMode]
Priority = 1
[Layer.ActionMode]
Priority = 2
[Layer.MenuMode]
Priority = 3
[Layer.TargetGroupMode]
Priority = 4
[Layer.MacrosMode]
Priority = 7

; Empty layers used purely to trigger combo layers in certain conditions
[Layer.R1Held]
Auto = Do nothing
[Layer.CharacterStationary]
Auto = Do nothing
[Layer.MouseMoving]
Auto = Do nothing
[Layer.MouseStationary]
Auto = Do nothing
[Layer.AbilityBars]
Auto = Do nothing
[Layer.AbilityHighlight]
Auto = Do nothing

; Track when using analog sticks for movement/mouse (mostly for WantMouseCursor)
[Scheme]
When Move = Replace CharacterStationary layer with CharacterMoving layer
When Stop = Replace CharacterMoving layer with CharacterStationary layer
When Mouse Moves = Replace MouseStationary layer with MouseMoving layer
When Mouse Stops = Replace MouseMoving layer with MouseStationary layer

; Auto-add ActionMode when first start moving character in any direction
[Layer.CharacterMoving]
AutoLayers = ActionMode

; This waits until stop moving character/camera then switches to cursor mode
; It shows a preview of where cursor will go, and aborts after 1.5 seconds
[Layer.WantMouseCursor]
Hold Auto 1500 = Remove this layer
ShowMenus = CursorPosPreview
; Activate requested cursor mode once stop moving character & camera
; Note how auto-run does NOT prevent cursor mode from starting!
[Layer.WantMouseCursor+CharacterStationary+MouseStationary]
AutoLayers = CursorMode

; Makes sure either ActionMode or CursorMode is set, and if not sets one
; according to CharacterStationary (cursor) vs CharacterMoving (action)
[Layer.RestoreBasicMode]
Hold Auto 100 = Replace this layer with CursorMode layer
[Layer.RestoreBasicMode+CursorMode]
Auto = Remove RestoreBasicMode layer
[Layer.RestoreBasicMode+ActionMode]
Auto = Remove RestoreBasicMode layer
[Layer.RestoreBasicMode+CharacterStationary]
Hold Auto 1 = Replace RestoreBasicMode with CursorMode layer
[Layer.RestoreBasicMode+CharacterMoving]
Hold Auto 1 = Replace RestoreBasicMode with ActionMode layer

; This allows holding the Use Ability button to reset current ability menu
; or swapping between ability menu types if allowed to do so
[Scheme]
Hold Y = Add ActionModeReset layer
[Layer.ActionModeReset]
Press Auto = Reset AbilityBars menu
Auto = Remove this layer
Release Auto = Reset AbilityHighlight menu
[Layer.ActionModeReset+AbilityBars]
Auto = ${AbilMenuType = 1 ? Replace AbilityBars with AbilityHighlight}
[Layer.ActionModeReset+AbilityHighlight]
Auto = ${AbilMenuType = 1 ? Replace AbilityHighlight with AbilityBars}

; Makes sure correct ability menu is used if changed it at runtime in settings
[Layer.ActionMode]
Press Auto = ${AbilMenuType = 2 ? Replace AbilityBars with AbilityHighlight}
Auto = ${AbilMenuType = 0 ? Replace AbilityHighlight with AbilityBars}

; Once MenuMode starts, wait until stop moving character/camera to show cursor
[Layer.MenuMode+CharacterStationary+MouseStationary]
AutoLayers = MenuModeCursorReady
[Layer.MenuModeCursorReady]
Parent = MenuMode
ShowMenus = Hide InteractReticle
Mouse = Cursor
; For OverlayMenu, hide the cursor but still be ready for RStick to move
[Layer.OverlayMenuMode+MenuModeCursorReady]
Mouse = Hide
; Swap from MenuMode to CursorMode if press RStick with MenuModeCursorReady
[Layer.MenuMode+MenuModeCursorReady+MouseMoving]
Auto = Replace MenuMode with CursorMode

; Request cursor control when use any UI-window-opening key bind in ActionMode
[Layer.ActionMode]
When Character = Add WantMouseCursor layer
When Inventory = Add WantMouseCursor layer
When Bags = Add WantMouseCursor layer
When Journal = Add WantMouseCursor layer
When Map = Add WantMouseCursor layer
When Skills = Add WantMouseCursor layer
When Abilities = Add WantMouseCursor layer
When Book = Add WantMouseCursor layer
When Medley = Add WantMouseCursor layer
When Guild = Add WantMouseCursor layer
When Avatar = Add WantMouseCursor layer

; Restore cursor control if possibly trying to exit the game
[Scheme]
When Settings = Add WantMouseCursor layer
When Camp = Add WantMouseCursor layer
When QuickExit = Add WantMouseCursor layer

; Request cursor and jump it to LootWindow's convenient Loot All button
; when likely trying to loot a corpse
When Interact = Add WantQuickLoot layer
When LootTarget = Add WantQuickLoot layer
[Layer.WantQuickLoot]
Parent = WantMouseCursor
Auto = Jump cursor to LootWindowLootAll

; Reset group targeting when do anything that might target anything else
[Layer.TargetGroupMode]
When TargetCycleNPC = Remove this layer
When TargetNearestNPC = Remove this layer
When TargetCyclePC = Remove this layer
When TargetNearestPC = Remove this layer
When Interact = Remove this layer
When Assist = Remove this layer
When AssistTarget = Remove this layer
When Cancel = Remove this layer
When SignalLeftClick = Remove this layer
When SignalRightClick = Remove this layer

; Hide default group target indicator once active target indicator is shown
[Layer.TargetGroupMode+L1Held]
AutoLayers = HideDefaultGroupTarget

; L1+A (or L1+R1+A) should also hide default group target indicator,
; since that's clearly not what L1 is being held down for now
[Layer.CursorMode+L1Held]
When press A = Add HideDefaultGroupTarget layer
[Layer.CursorMode+L1Held+R1Held]
When press A = Add HideDefaultGroupTarget layer

; Hides default group target indicator from above - removed when L1 released
[Layer.HideDefaultGroupTarget]
ShowMenus = Hide TargetGroupDefault
Parent = L1Held

; Sets default group target from L1+D-Left, and also forces the indicator
; to show even if HideDefaultGroupTarget above is active, until L1 released
[Layer.SetDefaultGroupTarget]
Auto = Set TargetCycleGroup default to last key pressed
DPad Left = Set TargetCycleGroup default to last key pressed
ShowMenus = Show TargetGroupDefault
Parent = HideDefaultGroupTarget

; Use AutoLook after have used Sit key bind, until next time move
[Layer.SitAndLook]
Priority = -1
Mouse = LookAuto
When Press LStick = Remove this layer
When AutoRun = Remove this layer
[Scheme]
When Sit = ${AutoLookMode = Sitting ? Add SitAndLook layer}

; Get Macros Menu out of the way if use mouse button clicks during Cursor Mode
[Layer.MacrosMode+CursorMode]
When Press A = Remove MacrosMode
When Press R2 = Remove MacrosMode

; Used to reset AbilityBars after messing with their configuration in Settings
[Layer.SettingsMenuResetAbliityBars]
Parent = SettingsMenuMode
Release Auto = Reset AbilityBars


################################################################################
## KEY BINDS
################################################################################

[KeyBinds]
AssistTarget = LClick at AssistButton
WhoTarget = /whotarget
LootTarget = /loot
Camp = /camp
QuickExit = Alt-F4
Interact = Jump cursor to InteractHotspot, Left-Click, Right-Click
; Signal-only key binds used purely for layer management tasks
SignalLeftClick = Signal Only
SignalRightClick = Signal Only
; This is a workaround to a bug in AOA where pressing Esc after using the chat
; box will re-activate the chat box and have it "eat" keyboard inputs. Clicking
; any mouse button anywhere outside chat entry first prevents this though, and
; since middle-click doesn't do anything else, it's safe to use for this here.
Cancel = MClick, Esc



################################################################################
## VARIABLES / SETTINGS
################################################################################

[Variables]
; This allows auto camera rotation when strafe left or right, so can fully
; steer using only the left analog stick while this is active. Best to turn
; off if prefer to play in first-person view. 0 = off, 1-3 = turn speed
CamSteer = 0
; This can enable 'LookAuto' mouse mode which uses left click instead of
; right-click when holding still so can move camera without turning character.
; Options are to use it any time holding still, only after sitting, or not use
; 'LookAuto' (i.e. need to hold L2 to manually switch to LookOnly mouse mode).
AutoLookMode = Stationary
AutoLookMode = Sitting
; Enables reticle display to aim clicks while in mouselook mode
ShowReticle = Yes
; Offsets click position for 3rd-person camera so don't click own character
; Can be set to None, Small, or Large (for different character size)
InteractOffset = None
InteractXPos = ${InteractOffset = None ? 50% : ${InteractOffset = Small ? 54% : 56%}}
InteractYPos = ${InteractOffset = None ? 50% : ${InteractOffset = Small ? 40% : 36%}}
; Affects how quickly d-pad based cursor movement accelerates (0 = fixed speed)
DPadMouseAccel = 1
; Enables L2 + DPad left/right to activate Windows Magnifier shortcut keys
WinMag = Off
; Enabled L2 + FPad 4-dir menu as alternate method for using abilities
QuickCastType = ${CopyIconsEnabled ? 2 : 0}
QuickCastMenu = ${QuickCastType > 1 ? QuickCast16 : QuickCast4}
; Allows alternate button mappings using ButtonSwap (Modern or EQOA)
ButtonMap = Modern
; Changes how ability menu looks/works
AbilMenuType = 2
AbilMenuTypeLabel = ${AbilMenuType[0:Custom Overlay Menu, 1:Hot Swap (HOLD 'Use Ability' button), 2:Highlight In-Game UI]}
AbilBarsType = 0
AbilBarsTypeLabel = ${AbilBarsType[0:Plain Bars, Rotating (EQOA-style) bar, Rotating + selection label]}
AbilBarsShowAltLabel = ${AbilBarsType = 2}
AbilBarsStyle = ${AbilBarsType ? Slots : List}
; Contents of Overlay Multi-bars-style Ability Menu
AbilBarsShowTitle = ${AbilBarsStyle = Slots ? Yes : No}
AbilBarOn1 = Yes
AbilBarTitle1 = Bar1
AbilBarDefault1 = ${AbilBarsStyle = Slots ? Recall : Match}
AbilBarAutoAdvance1 = No
AbilBarOn2 = Yes
AbilBarTitle2 = Bar2
AbilBarDefault2 = ${AbilBarsStyle = Slots ? Recall : Match}
AbilBarAutoAdvance2 = No
AbilBarOn3 = No
AbilBarTitle3 = Bar3
AbilBarDefault3 = ${AbilBarsStyle = Slots ? Recall : Match}
AbilBarAutoAdvance3 = No
AbilBarOn4 = No
AbilBarTitle4 = Bar4
AbilBarDefault4 = ${AbilBarsStyle = Slots ? Recall : Match}
AbilBarAutoAdvance4 = No
AbilBarOn5 = No
AbilBarTitle5 = Bar5
AbilBarDefault5 = ${AbilBarsStyle = Slots ? Recall : Match}
AbilBarAutoAdvance5 = No
AbilBarCount = ${AbilBarOn1 + ${AbilBarOn2 + ${AbilBarOn3 + ${AbilBarOn4 + ${AbilBarOn5}}}}}
AbilBarEditNum = 1
; Allow editing some overlay menus at runtime with these
; (may want to disable if tend to hold button without thinking during combat!)
AllowEditMacros = Yes
AllowEditAbilBars = No
AllowEditQuickCast = Yes
AllowEditMenus = No
; Sets if Assist should always assist current target or group's "main assist"
AssistType = Target Main Assist
; [L2]+Select/Start shortcut assignments
HoldStartKeybind = Do nothing
TapL2StartKeybind = Inventory
HoldL2StartKeybind = Character
TapSelectKeybind = Bags
HoldSelectKeybind = Book
TapL2SelectKeybind = Map
HoldL2SelectKeybind = ToggleUI
VarToAssign = TapL2StartKeybind

; Set certain mouse properties according to above variables
[Mouse]
HotspotJumpAccelRate = ${DPadMouseAccel * 8}
MoveLookSpeed = ${CamSteer * 10}

[Hotspots]
InteractHotspot = ${InteractXPos}, ${InteractYPos}


################################################################################
## MENUS
################################################################################

[Menu.MainMenu]
Style = Highlight
Priority = 2
TitleHeight = 0
Mouse = Click
Back = Add RestoreBasicMode layer
D = : ${MainMenuAlignY != B ? Add OverlayMenuMode layer}
U = : ${MainMenuAlignY == B ? Add OverlayMenuMode layer}
Default = MainMenu1
MainMenu1-12 = :

[Menu.OverlayMenu]
Title = Overlay
Style = Grid
GridWidth = 3
Position = ${MainMenuX}, ${MainMenuY} + ${MainMenuAlignY = B ? -54 : 54}
Alignment = ${MainMenuAlignX}, ${MainMenuAlignY}
Priority = 2
FadeInTime = 125
FadeOutTime = 250
Back = Add RestoreBasicMode layer
1 = Menu

[Menu.OverlayMenu.Menu]
Back = Remove OverlayMenuMode layer
U = : Remove OverlayMenuMode layer
D = : Remove OverlayMenuMode layer
1 = Settings: Add SettingsMenuMode layer
2 = "Group Size: ${GroupSize}": .Menu.Group Size
3 = Layout: Edit UI Layout
4 = Profile: Change Profile
5 = Toggle Windowed: SwapWindowMode
6 = Quit

[Menu.OverlayMenu.Menu.Group Size]
Confirm = ..
Default = ${GroupSize}
1-6 = #: Temporarily set GroupSize to #

[Menu.OverlayMenu.Menu.Quit]
1 = Camp: Camp
2 = Alt-F4
3 = Close Overlay

[Menu.OverlayMenu.Menu.Quit.Alt-F4]
1 = Cancel: ..
2 = Confirm: QuickExit

[Menu.OverlayMenu.Menu.Quit.Close Overlay]
1 = Cancel: ..
2 = Confirm: Quit App

[Menu.Settings]
Style = List
Position = CX, CY
Alignment = CX, CY
Priority = 2
ItemSize = ${ResScale * 640}, ${ResScale * 64}
FontSize = ${ResScale * 18}
TitleHeight = ${ResScale * 35}
FadeInTime = 125
FadeOutTime = 250
Back = Remove SettingsMenuMode layer
1 = Mouse & Camera Options
2 = Abilities & Menu Setup
3 = Gamepad Button Assignments
